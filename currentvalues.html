<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BlackScreen Status JSON</title>
</head>
<body>
    <h1>BlackScreen Status</h1>
    <pre id="jsonOutput">Loading...</pre>

    <script>
        const projectId = "testprojfr"; // replace with your project ID
        const apiKey = "AIzaSyCu9kLqzd-Xfm23GhY4kUuPRyi1kiztjTg"; // replace with your API key
        const docPath = "options/option1"; // document path
        const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${docPath}?key=${apiKey}`;

        async function loadBlackScreenValue() {
            try {
                const res = await fetch(url);
                const result = await res.json();

                let blackscreenValue = false;
                if (result.fields && result.fields.blackscreen) {
                    blackscreenValue = result.fields.blackscreen.booleanValue;
                }

                // Display as raw JSON
                const output = { blackscreen: blackscreenValue };
                document.getElementById("jsonOutput").textContent = JSON.stringify(output, null, 2);

            } catch (err) {
                document.getElementById("jsonOutput").textContent = "Error fetching data: " + err;
            }
        }

        loadBlackScreenValue();
    </script>
</body>
</html>
