<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toggle BlackScreen</title>
</head>
<body>
  <h1>BlackScreen Toggle</h1>
  <label>
    <input type="checkbox" id="blackscreen"> Enable BlackScreen
  </label>

  <script>
    const checkbox = document.getElementById("blackscreen");

    checkbox.addEventListener("change", async () => {
      const res = await fetch("/api/toggle", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: checkbox.checked }),
      });
      const data = await res.json();
      console.log(data);
    });
  </script>
</body>
</html>
